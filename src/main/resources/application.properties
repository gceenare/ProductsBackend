# Database configuration (supports Render)
# Set the following environment variables on Render or your host to switch DBs:
# - SPRING_DATASOURCE_URL (e.g. jdbc:postgresql://host:5432/dbname or jdbc:mysql://host:3306/db)
# - SPRING_DATASOURCE_USERNAME
# - SPRING_DATASOURCE_PASSWORD
# By default it falls back to the existing Afrihost MySQL values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/products}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Server Configuration
server.port=10000
server.servlet.context-path=/

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Tomcat Server Configuration
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-post-size=10485760

# Production Upload Directory
app.upload.dir=/var/www/products/images/

# PostgreSQL profile (local development)
# To use PostgreSQL with the project, activate the "postgres" Spring profile:
# - Set the environment variable `SPRING_PROFILES_ACTIVE=postgres`, or
# - Run the app with `--spring.profiles.active=postgres`.
# A sample Postgres profile file `application-postgres.properties` is provided.
